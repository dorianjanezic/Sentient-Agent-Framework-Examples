steps:
# Build the container image
- name: 'gcr.io/cloud-builders/docker'
  args: ['build', '-t', 'gcr.io/$PROJECT_ID/arxiv-agent:$COMMIT_SHA', '.']

# Push the container image to Container Registry
- name: 'gcr.io/cloud-builders/docker'
  args: ['push', 'gcr.io/$PROJECT_ID/arxiv-agent:$COMMIT_SHA']

# Deploy container image to Cloud Run
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  entrypoint: gcloud
  args:
  - 'run'
  - 'deploy'
  - 'arxiv-agent'
  - '--image'
  - 'gcr.io/$PROJECT_ID/arxiv-agent:$COMMIT_SHA'
  - '--region'
  - 'us-central1'
  - '--platform'
  - 'managed'
  - '--allow-unauthenticated'
  - '--set-env-vars'
  - 'MODEL_API_KEY=${_MODEL_API_KEY},MODEL_BASE_URL=${_MODEL_BASE_URL},MODEL_NAME=${_MODEL_NAME}'

# Store images in Google Container Registry
images:
- 'gcr.io/$PROJECT_ID/arxiv-agent:$COMMIT_SHA'

substitutions:
  _MODEL_BASE_URL: 'https://api.fireworks.ai/inference/v1'
  _MODEL_NAME: 'accounts/fireworks/models/llama-v3-70b-instruct'
  # MODEL_API_KEY should be set as a secret in Cloud Build 