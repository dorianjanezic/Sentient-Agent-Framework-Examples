version: '3'

services:
  arxiv-agent:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - MODEL_API_KEY=${MODEL_API_KEY}
      - MODEL_BASE_URL=${MODEL_BASE_URL:-https://api.fireworks.ai/inference/v1}
      - MODEL_NAME=${MODEL_NAME:-accounts/fireworks/models/llama-v3-70b-instruct}
    volumes:
      - ./src:/app/src
